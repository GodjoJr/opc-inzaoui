name: CI — Ina Zaoui

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_ENV: test
  APP_SECRET: test_secret_key_for_ci_pipeline
  DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/inazaoui?serverVersion=16&charset=utf8"

jobs:
  ci:
    name: Build, Static Analysis & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inazaoui_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. BASE DE LA CONFIGURATION
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, gd, intl, mbstring, xml, pcov
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment & test database
        run: |
          mkdir -p public/uploads
          php bin/console cache:warmup --env=dev
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:schema:update --force --env=test
          php bin/console doctrine:fixtures:load --no-interaction --env=test

      # 2. ANALYSE STATIQUE & LINTERS SYMFONY
      - name: Lint Symfony YAML, Twig & Container
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # 3. EXÉCUTION DES TESTS & COUVERTURE (SEUIL 70 %)
      - name: Run PHPUnit with coverage
        run: php bin/phpunit --coverage-clover coverage.xml

      - name: Check minimum 70% code coverage
        run: |
          php -r '
          $xml = simplexml_load_file("coverage.xml");
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          $ratio = $statements > 0 ? round(($covered / $statements) * 100, 2) : 0;
          echo "Code coverage: {$ratio}%\n";
          if ($ratio < 70) {
              fwrite(STDERR, "Error: Code coverage ({$ratio}%) is below 70%.\n");
              exit(1);
          }
          '